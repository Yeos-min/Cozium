<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eae3ce">
<title>Cozium — 바탕화면 정리 게임</title>
<meta name="description" content="어질러진 바탕화면을 방 치우듯 정리하는 3D 웹 게임. 파일을 집어 상자(폴더)에 넣어 정리해요.">
<script src="./js/entry-route.js"></script>
<!-- 첫 화면에 필요한 것만: 같은 카메라의 정지 이미지, 로고·문구 글꼴(10-24 Nunito 900 + 나눔스퀘어라운드 B), 방 모델. tests/landing/preload.test.mjs가 잠근다. -->
<link rel="preload" href="./assets/landing/room-3d/poster-L.webp" as="image" type="image/webp">
<link rel="preload" href="./models/room.glb" as="fetch" type="model/gltf-binary" crossorigin>
<link rel="preload" href="./assets/fonts/nunito/Nunito-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/nanum-square-round/NanumSquareRoundB.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/landing-story.css">
<link rel="stylesheet" href="./css/site-nav.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
</head>
<body>
<header class="site-nav" id="topNav" data-state="open">
  <a class="brand" href="./index.html" aria-label="Cozium 처음으로">cozium<span aria-hidden="true">⌁</span></a>
  <nav class="links" aria-label="사이트">
    <a href="./help.html">이용 안내</a>
    <a class="go" href="./app.html">정리방 들어가기</a>
  </nav>
</header>
<main class="stage" id="stage" data-try="closed" data-scene="room" data-room="loading" aria-label="Cozium: 책상 위 노트북을 누르면 나의 바탕화면이 켜지고, 아침 다락방에서 노트북 말풍선을 누르면 방에 널린 파일이 노트북으로 들어가 어질러진 바탕화면이 됩니다. 파일 더미를 직접 상자에 넣어 볼 수 있습니다">
  <canvas class="room" id="room" aria-hidden="true"></canvas>
  <img class="poster" id="poster" src="./assets/landing/room-3d/poster-L.webp" alt="">
  <canvas class="gl" id="gl" hidden aria-hidden="true"></canvas>
  <div class="world" id="world">
    <div class="plate desk" id="desk" style="opacity:0">
      <img src="./assets/landing/parts/desktop-v4/wallpaper.webp" alt="">
      <div class="icons" id="deskIcons"></div>
    </div>
    <span class="screen-glow" id="screenGlow" aria-hidden="true"></span>
    <div class="plate" id="deskChrome" style="opacity:0">
      <img src="./assets/landing/parts/desktop-v4/taskbar.webp" alt="" style="left:19px;top:846px;width:1634px;height:60px">
      <img src="./assets/landing/parts/desktop-v4/monitor-frame.svg" alt="">
    </div>
  </div>
  <!-- 10-25 디자인 시스템 확정: 첫 화면과 끝 장면은 같은 자리(왼쪽 위 여백선)에 다른 내용. 화면 px로 놓으려고 .world 밖 -->
  <div class="hero" id="title">
    <div class="hero-start" id="heroStart">
      <h1>Cozium</h1>
      <p>당신의 어질러진 바탕화면을<br>방 치우듯 정리해 보세요</p>
      <nav class="cta" id="cta" aria-label="정리방 시작">
        <a class="start" href="./app.html"><span class="start-label">시작해볼까요?</span></a>
      </nav>
    </div>
    <div class="hero-end" id="heroEnd" hidden>
      <h2>방이 깨끗해졌어요</h2>
      <p>이번엔 진짜 내 바탕화면 차례예요</p>
      <a class="end-go" id="endGo" href="./app.html" hidden>내 바탕화면 정리하러 가기 <span aria-hidden="true">→</span></a>
    </div>
  </div>
  <!-- 11-03 새 첫 화면: 노트북만 덩그러니(눌러 시작) → 정면 로그인 화면 → 방 + Cozium → 노트북 말풍선 → 파일이 터져 나옴. js/landing-story/story.js intro -->
  <div class="intro-cue" id="introCue" hidden>
    <svg class="intro-rays" aria-hidden="true"><g class="boil"></g></svg>
    <button class="intro-hit" id="introHit" type="button"><span>노트북을 눌러 시작하기</span><svg class="intro-under" viewBox="0 0 260 14" aria-hidden="true"><path d="M3 8 Q66 12 130 8 T257 5"/><path d="M5 10 Q70 13 131 9 T254 7"/></svg></button>
  </div>
  <div class="welcome" id="welcome" aria-hidden="true">
    <div class="welcome-av"><svg viewBox="0 0 48 48"><circle cx="24" cy="17" r="8"/><path d="M8 42c2-9 9-13 16-13s14 4 16 13"/></svg></div>
    <b>나의 바탕화면</b>
    <p><i></i>환영합니다</p><!-- 윈도우 「환영합니다」 그대로가 모티브라 말투 규칙(~해요)의 예외(11-03 사용자) -->
  </div>
  <!-- 11-03 사용자 선택 B: 연필 손그림 말풍선(진한 연필 두 번 겹쳐 긋기 — 3D 외곽선과 같은 선). 평소 「···」, 올리면 「정리 시작해볼까요?」 -->
  <button class="bubble" id="bubble" type="button" hidden aria-label="정리 시작해볼까요?">
    <span class="b-idle" aria-hidden="true"><svg class="b-shape" width="70" height="62" viewBox="-2 -2 74 64" aria-hidden="true"><path class="f" d="M18 2 Q35.0 -1.0 52 2 Q71 1 69 18 L68 26 Q69 43 52 42 L38 43 L14 60 L22 42 L18 43 Q1 43 2 26 L1 18 Q1 1 18 2"/><path class="s" d="M18 2 Q35.0 -1.0 52 2 Q71 1 69 18 L68 26 Q69 43 52 42 L38 43 L14 60 L22 42 L18 43 Q1 43 2 26 L1 18 Q1 1 18 2"/><path class="s2" d="M19.3 0.7 Q35.0 -0.35 52 3.3 Q71 1 67.7 18 L69.3 26 Q69 43 52 43.3 L39.3 43 L12.7 60 L23.3 42 L18 41.7 Q1 43 3.3 26 L-0.30000000000000004 18 Q1 1 19.3 0.7"/></svg><span class="b-t">···</span></span>
    <span class="b-open" aria-hidden="true"><svg class="b-shape" width="220" height="80" viewBox="-2 -2 224 82" aria-hidden="true"><path class="f" d="M18 2 Q110.0 -1.0 202 2 Q221 1 219 18 L218 44 Q219 61 202 60 L38 61 L14 78 L22 60 L18 61 Q1 61 2 44 L1 18 Q1 1 18 2"/><path class="s" d="M18 2 Q110.0 -1.0 202 2 Q221 1 219 18 L218 44 Q219 61 202 60 L38 61 L14 78 L22 60 L18 61 Q1 61 2 44 L1 18 Q1 1 18 2"/><path class="s2" d="M19.3 0.7 Q110.0 -0.35 202 3.3 Q221 1 217.7 18 L219.3 44 Q219 61 202 61.3 L39.3 61 L12.7 78 L23.3 60 L18 59.7 Q1 61 3.3 44 L-0.30000000000000004 18 Q1 1 19.3 0.7"/></svg><span class="b-t">정리 시작해볼까요?</span></span>
  </button>
  <div class="story-bubble" id="storyCap" data-on="false" aria-hidden="true"><svg></svg><p class="sb-text"><b class="story-n"></b><span class="story-t"></span></p></div>
  <button class="skip" id="skip" type="button" hidden>건너뛰고 바로 시작 →</button>
  <div class="loading" aria-hidden="true"><i></i></div>
  <div class="veil" id="veil" aria-hidden="true"></div>
  <p class="sr-only" id="sceneStatus" aria-live="polite"></p>
</main>
<script type="module" src="./js/landing-story/story.js"></script>
</body>
</html>
